    <!-- Estilos de Splash Screen Nativo iOS PWA -->
    <style>
      #quiral-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f2f2f7;
        color: #000000;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        #quiral-splash-screen {
          background-color: #000000;
          color: #ffffff;
        }
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-logo-img {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      .splash-title {
        margin-top: 18px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .splash-subtitle {
        margin-top: 4px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #8e8e93;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.96);
          opacity: 0.85;
        }
      }
      #quiral-splash-screen.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de Carga Nativa Anti-Flicker para PWA Standalone -->
    <div id="quiral-splash-screen">
      <div class="splash-logo-container">
        <img src="/icon-192.png" alt="Quiral POS" class="splash-logo-img" />
      </div>
      <h1 class="splash-title">Quiral POS</h1>
      <span class="splash-subtitle">Punto de Venta · Inventario</span>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
