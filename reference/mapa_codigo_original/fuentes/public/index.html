<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Quiral</title>
    <meta name="description" content="Quiral POS - Desarrollado por Elytra" />
    <meta name="author" content="Elytra" />

    <!-- PWA e iOS Standalone: instalable en iPhone / Android / escritorio -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiral" />
    <meta name="application-name" content="Quiral" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style id="app-reset">
      html {
        height: 100% !important;
        min-height: 100% !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        min-height: -webkit-fill-available !important;
        background-color: #000000 !important;
      }
      body {
        height: 100% !important;
        min-height: 100% !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        min-height: -webkit-fill-available !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #000000 !important;
        overflow: hidden !important;
        -webkit-text-size-adjust: 100% !important;
        overscroll-behavior: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      #root {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        height: 100% !important;
        min-height: 100% !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        min-height: -webkit-fill-available !important;
        width: 100% !important;
        overflow: hidden !important;
        background-color: #000000 !important;
      }
      input, textarea {
        font-size: 16px; /* evita el zoom automático de iOS Safari */
        -webkit-user-select: auto;
        user-select: auto;
      }
    </style>
  </head>
  <body>
    <noscript>Quiral necesita JavaScript.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
